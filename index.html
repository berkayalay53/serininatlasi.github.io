<meta charset="UTF-8">

<meta property="og:title" content="Serinin Atlası — Berkay Alay">

<link rel="apple-touch-icon" href="./serininatlasi.jpg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="./style.css">
</head>

<body>

  <div class="grain"></div>

  <div class="fixed-bg"></div>

  <div id="intro-screen">
    <div class="intro-bg"></div>
    <div class="intro-content">
      <h1 class="intro-title">Serinin Atlası</h1>
      <p class="intro-sub">"Ulaşamadığın bir bakış, söyleyemediğin bir cümle ve hâlâ bekleyen bir şarkı. Hepsi burada sustu."</p>
      <button id="start-btn">DİNLE</button>
    </div>
  </div>

  <main class="main" id="mainPage">
    <div class="player-box">
      
      <iframe 
        data-testid="embed-iframe" 
        style="border-radius:12px" 
        src="https://open.spotify.com/embed/playlist/5FYHflAhHlES0AkvfKDIwW?utm_source=generator" 
        width="100%" 
        height="352" 
        frameBorder="0" 
        allowfullscreen="" 
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" 
        loading="lazy">
      </iframe>

    </div>

    <a href="https://berkayalay53.github.io/" class="back-link">
      ← Ana Sayfaya Dön
    </a>
  </main>

  <script>
    const introScreen = document.getElementById('intro-screen');
    const startBtn = document.getElementById('start-btn');
    const mainPage = document.getElementById('mainPage');

    startBtn.addEventListener('click', () => {
      // Intro perdesini kaldır
      introScreen.classList.add('fade-out');
      
      // Ana ekranı göster
      setTimeout(() => {
        mainPage.classList.add('visible');
        introScreen.style.display = 'none'; 
      }, 1000);
    });
  </script>
<script>
  // === SAYFA YÜKLENME YÖNETİCİSİ ===
  
  // 1. Tarayıcı önbelleğinden (Geri butonuyla) geliniyorsa sayfayı yenileme sorunu olmasın
  window.addEventListener("pageshow", function(event) {
    if (event.persisted) {
      document.body.classList.add('loaded');
      document.body.style.opacity = "1";
    }
  });

  // 2. Her şey yüklendiğinde (Resimler, CSS) perdeyi aç
  window.addEventListener('load', () => {
    document.body.classList.add('loaded'); // CSS'teki .loaded opacity:1 yapar
    // Eğer toz efekti varsa başlat (Yoksa hata vermez, geçer)
    if (typeof createDust === "function") createDust(); 
  });
  
  // 3. Güvenlik Sübabı: Eğer 3 saniye içinde yüklenmezse zorla aç (Karanlıkta kalmasınlar)
  setTimeout(() => {
    document.body.classList.add('loaded');
  }, 3000);
</script>
</body>
</html>
