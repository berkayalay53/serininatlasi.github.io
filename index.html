<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Serinin Atlası — Berkay Alay</title>

<meta property="og:title" content="Serinin Atlası — Berkay Alay">
<meta property="og:description" content="Ulaşamadığın bir bakış, söyleyemediğin bir cümle ve hâlâ bekleyen bir şarkı. Hepsi burada sustu.">
<meta property="og:image" content="https://berkayalay53.github.io/serininatlasi.github.io/serininatlasi.jpg">
<link rel="icon" href="./serininatlasi.jpg" type="image/jpeg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="./style.css">
</head>

<body>

  <div id="intro-screen">
    <div class="intro-bg"></div>
    
    <div class="intro-content">
      <h1 class="intro-title">Serinin Atlası</h1>
      <p class="intro-sub">"Ulaşamadığın bir bakış, söyleyemediğin bir cümle ve hâlâ bekleyen bir şarkı. Hepsi burada sustu."</p>
      <button id="start-btn">DİNLE</button>
    </div>
  </div>

  <div class="fixed-bg"></div>
  <div class="grain"></div>

  <main class="main" id="mainPage">
    
    <div class="player-box">
      <iframe 
        src="https://open.spotify.com/embed/playlist/0?utm_source=generator&theme=0" 
        width="100%" 
        height="352" 
        frameBorder="0" 
        allowfullscreen="" 
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" 
        loading="lazy"
        style="border-radius: 8px;">
      </iframe>
    </div>

    <a href="https://berkayalay53.github.io/" class="back-link">
      ← Kütüphaneye Dön
    </a>

  </main>

  <script>
    const introScreen = document.getElementById('intro-screen');
    const startBtn = document.getElementById('start-btn');
    const mainPage = document.getElementById('mainPage');

    startBtn.addEventListener('click', () => {
      // Intro perdesini kaldır
      introScreen.classList.add('fade-out');
      
      // İçeriği göster
      setTimeout(() => {
        mainPage.classList.add('visible');
        introScreen.style.display = 'none'; // Tamamen sil
      }, 1000);
    });
  </script>

</body>
</html>
